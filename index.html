<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Email List LTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: one column. LTV tiles are the page; a short buyer section and one note sit below. Blue ink on a cool paper ground, navy at night. */
:root {
  --bg: #f2f5fa;
  --bg-glow: #dfe8f7;
  --panel: #ffffff;
  --panel-2: #f6f8fc;
  --ink: #0f1b2d;
  --muted: #5a6880;
  --rule: #dbe2ee;
  --accent: #2459c8;
  --accent-ink: #1a3f8f;
  --accent-soft: #e3ebfb;
  --amber: #b5781c;
  --amber-soft: #f5e8d2;
  --shadow: 0 1px 2px rgba(22, 48, 102, 0.06), 0 8px 24px -12px rgba(22, 48, 102, 0.18);
  --c1: #2459c8; --c2: #5b8def; --c3: #b5781c; --c4: #1a3f8f; --c5: #8fb3f5; --c6: #3d7dd8; --c7: #0e6e8c; --c8: #7a8fb5;
  --display: "Geist", "Helvetica Neue", Arial, sans-serif;
  --body: "Geist", "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1220; --bg-glow: #13254a; --panel: #111b2e; --panel-2: #0e1727; --ink: #e6edf8; --muted: #93a3bf; --rule: #22304a;
    --accent: #6f9cff; --accent-ink: #a9c3ff; --accent-soft: #19294a; --amber: #e3a54e; --amber-soft: #3a2d18;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px -14px rgba(0, 12, 40, 0.8);
    --c1: #6f9cff; --c2: #9fbcff; --c3: #e3a54e; --c4: #3f6fe0; --c5: #c8d8ff; --c6: #4f8df0; --c7: #5bb4d0; --c8: #8a9cc0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1220; --bg-glow: #13254a; --panel: #111b2e; --panel-2: #0e1727; --ink: #e6edf8; --muted: #93a3bf; --rule: #22304a;
  --accent: #6f9cff; --accent-ink: #a9c3ff; --accent-soft: #19294a; --amber: #e3a54e; --amber-soft: #3a2d18;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px -14px rgba(0, 12, 40, 0.8);
  --c1: #6f9cff; --c2: #9fbcff; --c3: #e3a54e; --c4: #3f6fe0; --c5: #c8d8ff; --c6: #4f8df0; --c7: #5bb4d0; --c8: #8a9cc0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body {
  background: radial-gradient(1100px 520px at 12% -8%, var(--bg-glow), transparent 70%), var(--bg);
  background-attachment: fixed;
  color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 40px 72px; display: grid; gap: 28px; }
header { display: grid; gap: 8px; }
.eyebrow { font: 500 13px var(--mono); color: var(--accent); letter-spacing: 0.02em; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 6vw, 46px); letter-spacing: -0.035em; margin: 0; line-height: 1; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 650; font-size: 19px; margin: 0; letter-spacing: -0.015em; }
.sub { color: var(--muted); margin: 0; max-width: 60ch; text-wrap: pretty; }
section { display: grid; gap: 14px; min-width: 0; }
.foot { color: var(--muted); font-size: 13.5px; max-width: 78ch; margin: 0; text-wrap: pretty; }
.foot ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.foot strong { color: var(--ink); font-weight: 600; }

/* LTV tiles */
.ltv-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.tile { background: var(--panel); border: 1px solid var(--rule); border-radius: 18px; padding: 20px 20px 18px; display: grid; gap: 2px; align-content: start; min-width: 0; box-shadow: var(--shadow); transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.tile:hover { transform: translateY(-2px); }
.tile .name { font: 650 16px var(--display); letter-spacing: -0.01em; }
.tile .ltv-label { font-size: 13px; color: var(--muted); margin-top: 10px; }
.tile .ltv { margin-bottom: 10px; font: 800 clamp(30px, 4.4vw, 46px)/1 var(--display); letter-spacing: -0.04em; color: var(--accent); font-variant-numeric: tabular-nums; }
.tile .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-top: 7px; font-size: 14px; font-variant-numeric: tabular-nums; }
.tile .row span:first-child { color: var(--muted); }
.tile .row strong { font-weight: 600; text-align: right; }
.tile .secondary { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); display: grid; }
.tile .sec-label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
.tile .secondary .row { font-size: 13px; padding-top: 5px; }
.tile .ltv-wait { color: var(--muted); font-size: clamp(24px, 3vw, 32px); letter-spacing: -0.02em; padding-block: 6px 4px; }
.tile .secondary.first { margin-top: 4px; }
.tile .sub-note { text-align: right; color: var(--muted); font-size: 12px; line-height: 1.3; }
.tile .note { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: var(--amber-soft); color: var(--amber); font-size: 12.5px; line-height: 1.4; }

/* buyer behaviour */
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.fact { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); display: grid; gap: 10px; min-width: 0; }
.fact p { margin: 0; font-size: 15.5px; line-height: 1.45; text-wrap: pretty; }
.fact .num { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.chart { position: relative; height: 190px; }

/* password screen */
body.locked .wrap > :not(header):not(#lock) { display: none; }
.lock { background: var(--panel); border: 1px solid var(--rule); border-radius: 18px; box-shadow: var(--shadow); padding: 22px; display: grid; gap: 10px; max-width: 460px; }
.lock label[for="pw"] { font: 600 15px var(--display); }
.lock-row { display: flex; gap: 8px; flex-wrap: wrap; }
.lock input[type="password"] { flex: 1 1 200px; min-width: 0; font: 16px var(--body); padding: 11px 13px; border-radius: 10px; border: 1px solid var(--rule); background: var(--panel-2); color: var(--ink); }
.lock input[type="password"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.lock button { font: 600 15px var(--body); padding: 11px 16px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; cursor: pointer; transition: filter .2s, transform .1s; }
.lock button:hover { filter: brightness(1.08); }
.lock button:active { transform: scale(0.98); }
.lock button:disabled { opacity: .6; cursor: wait; }
.lock button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.remember { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.lock-msg { margin: 0; font-size: 14px; color: var(--amber); min-height: 1.2em; }

@media (max-width: 1000px) { .ltv-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .facts { grid-template-columns: 1fr; } }
@media (max-width: 520px) {
  body { font-size: 14.5px; }
  .wrap { padding-inline: 16px; padding-block: 24px 48px; gap: 22px; }
  .ltv-tiles { gap: 10px; }
  .tile { padding: 14px 14px 12px; border-radius: 14px; }
  .tile .ltv { font-size: clamp(26px, 8.4vw, 34px); }
  .tile .row { font-size: 13px; }
  .fact { padding: 14px; }
  .fact p { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } html { scroll-behavior: auto; } }
</style>

<div class="wrap">
  <header>
    <h1>Email List LTV</h1>
    <p class="sub">What a customer from each email list is worth, from the last 12 months of affiliate sales.</p>
  </header>

  <form class="lock" id="lock" hidden autocomplete="on">
    <label for="pw">Password</label>
    <div class="lock-row">
      <input id="pw" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" id="unlock">Open dashboard</button>
    </div>
    <label class="remember"><input type="checkbox" id="remember"> Remember on this device</label>
    <p class="lock-msg" id="lock-msg" role="status"></p>
  </form>

  <section aria-label="LTV by list">
    <div class="ltv-tiles" id="tiles"></div>
  </section>

  <section>
    <h2>How customers buy</h2>
    <div class="facts">
      <div class="fact">
        <p id="fact-repeat"></p>
        <div class="chart"><canvas id="dist" aria-label="Purchases per buyer"></canvas></div>
      </div>
      <div class="fact">
        <p id="fact-first"></p>
        <div class="chart"><canvas id="d2f" aria-label="Days from signup to first purchase"></canvas></div>
      </div>
    </div>
  </section>

  <div class="foot" id="foot"></div>
</div>

<script>
const NAMES = ["Pegasus", "Pocket ATM", "HKU", "Bunbun"];
const NOTE = { Pegasus: "GetPegasus and the old Pegasus list combined; people on both are counted once." };
const RELIABLE = 300;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const money = (v, d = 0) => "$" + Number(v || 0).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = v => (v * 100).toFixed(v < 0.1 ? 1 : 0) + "%";
let DATA = null, scope = "All", charts = {};

function newValue(v) {
  if (v.untracked_revenue) return ["–", "waiting on ClickBank tracking"];
  if (v.m3 != null && v.m3_subscribers >= RELIABLE) return [money(v.m3, 2), "first 3 months"];
  if (v.m1 != null && v.m1_subscribers >= RELIABLE) return [money(v.m1, 2), "first month (too new for 3)"];
  return ["–", "too few recent signups"];
}

// HKU: ClickBank doesn't say who bought, so show totals we do know until subscriber-ID tracking is live
function hkuTile(l, v) {
  const k = v.known, since = new Date(k.since + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric" });
  return `<article class="tile">
    <span class="name">${l}</span>
    <span class="ltv-label">Customer LTV</span>
    <span class="ltv ltv-wait">Coming soon</span>
    <div class="secondary first">
      <span class="sec-label">What we know so far (since ${since})</span>
      <div class="row"><span>Email revenue</span><strong>${money(k.revenue)}</strong></div>
      <div class="row"><span>Sales</span><strong>${k.sales.toLocaleString()}</strong></div>
      <div class="row"><span>Average per sale</span><strong>${money(k.avg_sale)}</strong></div>
      <div class="row"><span>Refunds</span><strong>${k.refund_rate != null ? pct(k.refund_rate) : "–"}</strong></div>
      <div class="row"><span>Revenue per subscriber</span><strong>${money(k.per_subscriber, 2)}</strong></div>
      <div class="row"><span>Joined</span><strong>${v.subscribers.toLocaleString()}</strong></div><div class="sub-note">${v.active.toLocaleString()} still subscribed</div>
    </div>
    <div class="note">Customer LTV, repeat buyers and purchases per customer will be added once customer LTV tracking is in place on HKU links. Cloaked Arousal and Squirting School (WTS) aren't included; those are tracked by hand.</div>
  </article>`;
}

function tiles() {
  const names = NAMES.filter(l => DATA.lists[l]);
  document.getElementById("tiles").innerHTML = names.map(l => {
    const v = DATA.lists[l], b = v.buyer_stats || {}, [nv, nvNote] = newValue(v);
    if (v.known) return hkuTile(l, v);
    const subLtv = v.subscribers ? v.matched_revenue / v.subscribers : 0;
    return `<article class="tile">
      <span class="name">${l}</span>
      <span class="ltv-label">Customer LTV</span>
      <span class="ltv">${b.avg ? money(b.avg) : "–"}</span>
      <div class="row"><span>Customers</span><strong>${(b.buyers || 0).toLocaleString()}</strong></div>
      <div class="row"><span>Bought again</span><strong>${b.buyers ? pct(b.repeat_buyers / b.buyers) : "–"}</strong></div>
      <div class="row"><span>Purchases each</span><strong>${b.buyers ? (b.purchases / b.buyers).toFixed(2) : "–"}</strong></div>
      <div class="secondary">
        <span class="sec-label">Per email subscriber</span>
        <div class="row"><span>Subscriber LTV</span><strong>${money(subLtv, 2)}</strong></div>
        <div class="row"><span>New subscriber</span><strong>${nv}</strong></div><div class="sub-note">${nvNote}</div>
        <div class="row"><span>Joined</span><strong>${v.subscribers.toLocaleString()}</strong></div><div class="sub-note">${v.active.toLocaleString()} still subscribed</div>
      </div>
      ${v.untracked_revenue ? `<div class="note">Not counted yet: ${money(v.untracked_revenue)} of ClickBank sales. They'll count once HKU links carry the subscriber ID.</div>` : ""}
      ${NOTE[l] ? `<p class="foot" style="margin-top:10px">${NOTE[l]}</p>` : ""}
    </article>`;
  }).join("");
}

function baseOpts() {
  Chart.defaults.font.family = css("--body");
  return { responsive: true, maintainAspectRatio: false, animation: false,
    plugins: { legend: { display: false }, tooltip: { intersect: false } },
    scales: { x: { ticks: { color: css("--muted") }, grid: { display: false } },
              y: { ticks: { color: css("--muted"), precision: 0 }, grid: { color: css("--rule") }, beginAtZero: true } } };
}
function draw(id, cfg) { if (charts[id]) charts[id].destroy(); charts[id] = new Chart(document.getElementById(id), cfg); }

function buyers() {
  const o = DATA.overall || {};
  const share = o.repeat_revenue / o.revenue;
  document.getElementById("fact-repeat").innerHTML =
    `<span class="num">1 in ${Math.round(o.buyers / o.repeat_buyers)}</span> buyers buy again, and those repeat buyers bring in <span class="num">${pct(share)}</span> of buyer revenue.`;
  const d = o.dist || {};
  draw("dist", { type: "bar", options: baseOpts(), data: { labels: ["1 purchase", "2", "3–4", "5+"],
    datasets: [{ data: ["1", "2", "3–4", "5+"].map(x => d[x] || 0), backgroundColor: [css("--accent-soft"), css("--accent"), css("--accent"), css("--accent")], borderRadius: 6 }] } });
  const f = o.days_to_first || {}, b = f.buckets || {}, order = ["0–1d", "2–7d", "8–30d", "31–90d", "90d+"];
  const within30 = (b["0–1d"] || 0) + (b["2–7d"] || 0) + (b["8–30d"] || 0);
  document.getElementById("fact-first").innerHTML =
    `New subscribers who buy usually do it fast: half within <span class="num">${f.median} days</span> of joining, and <span class="num">${pct(within30 / (f.n || 1))}</span> within a month.`;
  draw("d2f", { type: "bar", options: baseOpts(), data: { labels: ["Same day", "2–7 days", "8–30 days", "31–90 days", "90+ days"],
    datasets: [{ data: order.map(x => b[x] || 0), backgroundColor: css("--accent"), borderRadius: 6 }] } });
}

function foot() {
  const c = DATA.coverage;
  document.getElementById("foot").innerHTML = `<strong>How to read this</strong><ul>
    <li><strong>Customer LTV</strong>: the average commission we earned from each person who bought, across all their purchases in the last 12 months. Vertex only keeps 12 months of sales, so this is 12-month value, not lifetime.</li>
    <li><strong>Subscriber LTV</strong>: the same sales divided by everyone who joined the list, buyers or not (including people who later unsubscribed). <strong>New subscriber</strong> is what someone who joined in the last year brought in during their first 3 months.</li>
    <li>HKU shows totals since its emails started (May 18) until customer LTV tracking is live on its links.</li>
    <li>Figures cover <strong>${pct(c.matched_revenue / c.total_revenue)}</strong> of sales; the rest couldn't be tied to a subscriber, so real values are a little higher. Bunbun has about 2 months of history, so its numbers will rise.</li>
    <li>Updated ${DATA.generated.slice(0, 10)}.</li></ul>`;
}

function render() { tiles(); buyers(); foot(); }

function start(d) { DATA = d; document.body.classList.remove("locked"); document.getElementById("lock").hidden = true; render(); }
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw) {
  const enc = await (await fetch("data.enc.json", { cache: "no-store" })).json();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function showLock(msg) {
  document.body.classList.add("locked");
  const f = document.getElementById("lock"); f.hidden = false;
  document.getElementById("lock-msg").textContent = msg || "";
  document.getElementById("pw").focus();
}
document.getElementById("lock").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("unlock"), pw = document.getElementById("pw").value;
  btn.disabled = true; document.getElementById("lock-msg").textContent = "Opening…";
  try {
    const d = await decrypt(pw);
    if (document.getElementById("remember").checked) { try { localStorage.setItem("ltv-pw", pw); } catch (_) {} }
    start(d);
  } catch (_) {
    document.getElementById("lock-msg").textContent = "That password didn't work. Check it and try again.";
  } finally { btn.disabled = false; }
});
(async () => {
  try {
    const r = await fetch("data.json", { cache: "no-store" });
    if (r.ok) return start(await r.json());
  } catch (_) {}
  let saved = null;
  try { saved = localStorage.getItem("ltv-pw"); } catch (_) {}
  if (saved) { try { return start(await decrypt(saved)); } catch (_) { try { localStorage.removeItem("ltv-pw"); } catch (__) {} } }
  showLock();
})();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => DATA && render());
new MutationObserver(() => DATA && render()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
</script>
